<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAM Bot — Academic Publication Studio (IEEE T-RO Journal & IEEE ICRA Conference)</title>
  <style>
    :root {
      --bg: #0f172a;
      --bar-bg: #1e293b;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --pill-bg: #0f172a;
      --pill-active: #2563eb;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    /* --- TOP STUDIO HEADER --- */
    .studio-bar {
      height: 56px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    /* --- SWITCHER PILLS --- */
    .view-switcher {
      display: flex;
      background: var(--pill-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .switch-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.15s ease;
    }

    .switch-btn:hover {
      color: #fff;
    }

    .switch-btn.active {
      background: var(--pill-active);
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    /* --- ACTIONS --- */
    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: #475569;
      color: #fff;
    }

    .btn-action-primary {
      background: #0284c7;
      border-color: #0369a1;
      color: #fff;
    }

    .btn-action-primary:hover {
      background: #0369a1;
    }

    /* --- MANUSCRIPT IFRAME WRAPPER --- */
    .viewer-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
      background: #f8fafc;
    }

    .manuscript-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="studio-bar">
    <div class="brand-section">
      <div class="brand-title">
        <span>🤖 SLAM Bot</span>
        <span class="brand-badge">Publication Studio</span>
      </div>
    </div>

    <!-- SWITCHER -->
    <div class="view-switcher" role="tablist" aria-label="Manuscript Format Switcher">
      <button id="btn-journal" class="switch-btn active" onclick="switchView('journal')" role="tab" aria-selected="true">
        <span>📚</span>
        <span>Journal Version (IEEE T-RO / Springer)</span>
      </button>
      <button id="btn-conf" class="switch-btn" onclick="switchView('conference')" role="tab" aria-selected="false">
        <span>📄</span>
        <span>Conference Version (IEEE ICRA 2-Col)</span>
      </button>
    </div>

    <!-- ACTIONS -->
    <div class="action-group">
      <a id="btn-open-ext" href="journal/journal.html" target="_blank" class="btn-action" title="Open current paper in its own browser tab">
        <span>↗️</span>
        <span>Open Standalone</span>
      </a>
      <button class="btn-action btn-action-primary" onclick="printCurrentView()" title="Print physical A4 or export to PDF">
        <span>🖨️</span>
        <span>Print / Save PDF</span>
      </button>
    </div>
  </header>

  <!-- EMBEDDED PUBLICATION VIEWER -->
  <main class="viewer-container">
    <iframe id="paper-frame" class="manuscript-frame" src="journal/journal.html" title="Academic Manuscript Viewer"></iframe>
  </main>

  <script>
    const frame = document.getElementById('paper-frame');
    const btnJournal = document.getElementById('btn-journal');
    const btnConf = document.getElementById('btn-conf');
    const btnOpenExt = document.getElementById('btn-open-ext');

    let currentMode = 'journal';

    function switchView(mode) {
      if (mode === currentMode) return;
      currentMode = mode;

      if (mode === 'journal') {
        frame.src = 'journal/journal.html';
        btnJournal.classList.add('active');
        btnJournal.setAttribute('aria-selected', 'true');
        btnConf.classList.remove('active');
        btnConf.setAttribute('aria-selected', 'false');
        btnOpenExt.href = 'journal/journal.html';
        document.title = 'SLAM Bot — IEEE Transactions on Robotics Journal Paper';
      } else {
        frame.src = 'conference/conference.html';
        btnConf.classList.add('active');
        btnConf.setAttribute('aria-selected', 'true');
        btnJournal.classList.remove('active');
        btnJournal.setAttribute('aria-selected', 'false');
        btnOpenExt.href = 'conference/conference.html';
        document.title = 'SLAM Bot — IEEE ICRA Conference Paper (2-Column)';
      }
    }

    function printCurrentView() {
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (e) {
        window.open(btnOpenExt.href, '_blank');
      }
    }

    // Support URL query parameter: ?format=conference or ?format=journal
    const params = new URLSearchParams(window.location.search);
    if (params.get('format') === 'conference') {
      switchView('conference');
    }
  </script>

</body>
</html>
